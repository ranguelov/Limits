*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%}
body{background:#0a0a0c;font-family:'Open Sans',system-ui,sans-serif;display:flex;align-items:flex-start;justify-content:center;min-height:100vh;margin:0;color:#fff;}
.device{width:390px;height:844px;background:#082648;display:flex;flex-direction:column;position:relative;overflow:hidden;border-radius:28px;box-shadow:0 30px 80px rgba(0,0,0,.6);margin:24px 0}
.chrome-top{background:#35363A;padding:16px 0 8px;box-shadow:0 1px 2px rgba(0,0,0,.2);display:flex;flex-direction:column;gap:12px}
.chrome-content{flex:1;min-height:0;background:#082648;display:flex;flex-direction:column;position:relative;overflow:hidden}
.chrome-bottom{background:#35363A;height:15px;position:relative;overflow:hidden}
@media (max-width:480px){
  body{background:#082648;align-items:stretch}
  .device{width:100%;height:100vh;height:100dvh;border-radius:0;box-shadow:none;margin:0}
  .chrome-top,.chrome-bottom{display:none}
}
.scrollarea{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
.scrollarea::-webkit-scrollbar{width:5px}
.scrollarea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
input{font-family:inherit}
input::placeholder{color:#A8B0BF}
@keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
@keyframes fade{from{opacity:0}to{opacity:1}}
.view{animation:slideUp .2s ease}
.toast{animation:fade .2s ease}
</style>
