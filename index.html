<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>MrBit — Limits Prototype</title>
<script src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
<script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Open+Sans:wght@400;600;700;800&family=Roboto:wght@400;500&display=swap" rel="stylesheet" />
<style>
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;height:100%}
  body{
    background:#0a0a0c;font-family:'Open Sans',system-ui,sans-serif;
    display:flex;align-items:center;justify-content:center;min-height:100vh;padding:24px;color:#fff;
  }
  .device{width:368px;background:#35363A;border-radius:24px;overflow:hidden;box-shadow:0 30px 80px rgba(0,0,0,.6)}
  .scrollarea{scrollbar-width:thin;scrollbar-color:rgba(255,255,255,.18) transparent}
  .scrollarea::-webkit-scrollbar{width:5px}
  .scrollarea::-webkit-scrollbar-thumb{background:rgba(255,255,255,.18);border-radius:3px}
  button{font-family:inherit;cursor:pointer;border:none;background:none;color:inherit}
  input{font-family:inherit}
  input::placeholder{color:#A8B0BF}
  @keyframes slideUp{from{transform:translateY(12px);opacity:0}to{transform:translateY(0);opacity:1}}
  @keyframes fade{from{opacity:0}to{opacity:1}}
  .view{animation:slideUp .2s ease}
  .toast{animation:fade .2s ease}
</style>
</head>
<body>
<div id="root"></div>
<script type="text/babel" data-presets="react">
const { useState } = React;

/* ===================================================================
   DESIGN TOKENS — copied from the mrbit.bg Figma design system
   =================================================================== */
const C = {
  night:'#082648',                 // Pop up / Night blue 60
  pink:'#760946',                  // Button / Dark pink 100  (primary)
  accent:'#00385D',                // Button / Dark blue 100  (close, tabs, pills)
  white:'#FFFFFF',
  gray:'#A8B0BF',                  // Input / Gray 10  (labels, placeholders, muted)
  gray2:'#A3ACC1',                 // Text / White Secondary
  line:'rgba(255,255,255,0.2)',    // Input underline / White 20
  card:'#0A2D50',                  // subtle grouped card on night blue
  cardLine:'rgba(255,255,255,0.08)',
  green:'#3FD18B', amber:'#FFC24B', red:'#FF7A7A',
  bars:'#35363A', addr:'#3D4043',
};
const FONT = "'Open Sans', sans-serif";

/* ---------- data model ---------- */
const RON = n => n.toLocaleString('en-US') + ' lei';
const PERIODS = ['daily','weekly','monthly'];
const PERIOD_LABEL = { daily:'Daily', weekly:'Weekly', monthly:'Monthly' };
const USUAL = { daily:1000, weekly:3000, monthly:8000 };
const SESSION_OPTS = [1,2,4,8,12];

function futureDate(daysAhead){
  const d = new Date(2026,5,10); d.setDate(d.getDate()+daysAhead);
  return d.toLocaleDateString('en-GB',{day:'numeric',month:'short'});
}

/* default: nothing configured */
const INITIAL = {
  daily:   { amount:null, status:'notset', date:null },
  weekly:  { amount:null, status:'notset', date:null },
  monthly: { amount:null, status:'notset', date:null },
  session: { hours:null,  status:'notset', date:null },
};

/* ===================================================================
   PRIMITIVES (styled to match the Figma component library)
   =================================================================== */
const BTN_VARIANTS = {
  teal:     '#007894',
  pink:     C.pink,
  gradient: 'linear-gradient(90deg,#EC0766 0%,#743090 100%)',
};
function Primary({children,onClick,disabled,variant='teal'}){
  const DISABLED_BG = { gradient:'#760946', teal:'#005160' };
  const bg = disabled && DISABLED_BG[variant] ? DISABLED_BG[variant] : BTN_VARIANTS[variant];
  return <button onClick={onClick} disabled={disabled} style={{
    height:40,width:'100%',borderRadius:6,background:bg,
    color:disabled?'rgba(255,255,255,0.5)':'#fff',
    fontFamily:FONT,fontWeight:700,fontSize:14,lineHeight:'16px',
    cursor:disabled?'not-allowed':'pointer',transition:'filter .12s,transform .08s'}}
    onMouseEnter={e=>{if(!disabled)e.currentTarget.style.filter='brightness(1.18)';}}
    onMouseLeave={e=>{e.currentTarget.style.filter='none';e.currentTarget.style.transform='scale(1)';}}
    onMouseDown={e=>{if(!disabled)e.currentTarget.style.transform='scale(.99)';}}
    onMouseUp={e=>e.currentTarget.style.transform='scale(1)'}>{children}</button>;
}
function Secondary({children,onClick,danger}){
  return <button onClick={onClick} style={{
    height:40,width:'100%',borderRadius:6,background:'transparent',
    border:`1px solid ${danger?'rgba(255,122,122,.55)':C.line}`,
    color:danger?C.red:'#fff',fontFamily:FONT,fontWeight:700,fontSize:14,lineHeight:'16px'}}>{children}</button>;
}
/* group header — Base Subtitle Bold 16/24 */
const Section = ({children}) =>
  <div style={{fontFamily:FONT,fontWeight:700,fontSize:16,lineHeight:'24px',color:'#fff'}}>{children}</div>;
/* field description — 10/14 gray */
const Label = ({children}) =>
  <div style={{fontFamily:FONT,fontWeight:400,fontSize:10,lineHeight:'14px',color:C.gray}}>{children}</div>;

/* underline input row (Figma "Input" component) */
function Field({label,children}){
  return <div style={{display:'flex',flexDirection:'column',gap:4,width:'100%'}}>
    {label && <Label>{label}</Label>}
    <div style={{display:'flex',alignItems:'center',gap:8,minHeight:20,paddingBottom:8,borderBottom:`1px solid ${C.line}`}}>
      {children}
    </div>
  </div>;
}

/* ---------- status + card icons (per Figma) ---------- */
const STATUS = {
  notset:  {dot:'#FFB124', label:'Not set',          prefix:null},
  active:  {dot:'#00AC4D', label:'Active',           prefix:null},
  pending: {dot:'#FFB124', label:'Changes Pending',  prefix:'Active on'},
  removal: {dot:'#FF6B6B', label:'Removal Pending',  prefix:'Expires on'},
};

function CardIcon({type}){
  const st = {stroke:'#FFFFFF', strokeWidth:1.4, fill:'none', strokeLinecap:'round', strokeLinejoin:'round'};
  if(type==='clock') return (
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="8" cy="8" r="6.3" {...st}/><path d="M8 4.6V8.2L10.3 9.6" {...st}/>
    </svg>);
  if(type==='calendar') return (
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="2.2" y="3.4" width="11.6" height="10.4" rx="2" {...st}/>
      <path d="M2.4 6.6H13.6" {...st}/><path d="M5.4 2.1V4.3M10.6 2.1V4.3" {...st}/>
    </svg>);
  return ( /* lock */
    <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
      <rect x="3.2" y="7" width="9.6" height="6.8" rx="1.8" {...st}/>
      <path d="M5.4 7V5.2a2.6 2.6 0 0 1 5.2 0V7" {...st}/>
    </svg>);
}

/* ---------- limit card (Figma "Limits" dashboard) ---------- */
function LimitCard({icon,title,kind,limit,onAction}){
  const s = STATUS[limit.status];
  const notset = limit.status==='notset';
  const hasValue = !notset;
  const value = kind==='session'
    ? (limit.hours+' '+(limit.hours===1?'hour':'hours'))
    : RON(limit.amount);
  const valueLabel = kind==='session' ? 'Current period' : 'Current limit';
  const statusText = s.label + (s.prefix && limit.date ? ' · '+s.prefix+' '+limit.date : '');
  return (
    <div style={{background:'#113255',borderRadius:8,padding:16,display:'flex',flexDirection:'column',gap:hasValue?16:0,width:'100%'}}>
      <div style={{display:'flex',gap:8,alignItems:'center'}}>
        <div style={{width:40,height:40,flexShrink:0,borderRadius:12,background:'#113255',
          border:'1px solid rgba(255,255,255,0.08)',display:'flex',alignItems:'center',justifyContent:'center'}}>
          <CardIcon type={icon}/>
        </div>
        <div style={{flex:1,minWidth:0,display:'flex',flexDirection:'column',gap:2}}>
          <div style={{fontFamily:FONT,fontWeight:700,fontSize:14,lineHeight:'20px',color:'#fff'}}>{title}</div>
          <div style={{display:'flex',alignItems:'center',gap:8}}>
            <span style={{width:8,height:8,borderRadius:4,background:s.dot,flexShrink:0}}/>
            <span style={{fontFamily:FONT,fontWeight:400,fontSize:12,lineHeight:'16px',color:C.gray}}>{statusText}</span>
          </div>
        </div>
        {notset
          ? <button onClick={onAction} style={{flexShrink:0,height:40,padding:'0 16px',borderRadius:6,
              fontFamily:FONT,fontWeight:700,fontSize:14,lineHeight:'16px',color:'#fff',
              background:'linear-gradient(90deg,#EC0766 0%,#743090 100%)'}}>Create</button>
          : <button onClick={onAction} style={{flexShrink:0,height:40,padding:'0 16px',borderRadius:6,boxSizing:'border-box',
              fontFamily:FONT,fontWeight:700,fontSize:14,lineHeight:'16px',color:'#00BADC',
              background:'transparent',border:'2px solid #00BADC'}}>Edit</button>}
      </div>
      {hasValue && (
        <>
          <div style={{height:1,width:'100%',background:'rgba(255,255,255,0.08)'}}/>
          <div style={{display:'flex',justifyContent:'space-between',alignItems:'center'}}>
            <span style={{fontFamily:FONT,fontWeight:400,fontSize:12,lineHeight:'16px',color:C.gray}}>{valueLabel}</span>
            <span style={{fontFamily:FONT,fontWeight:600,fontSize:14,lineHeight:'20px',color:'#fff'}}>{value}</span>
          </div>
        </>
      )}
    </div>
  );
}

/* ---------- info banner ---------- */
function InfoBanner({children,tone}){
  const c = tone==='danger'?C.red : tone==='warn'?C.amber : C.gray2;
  const bg = tone==='danger'?'rgba(255,122,122,.10)' : tone==='warn'?'rgba(255,194,75,.10)' : 'rgba(0,56,93,.55)';
  const bd = tone==='danger'?'rgba(255,122,122,.35)' : tone==='warn'?'rgba(255,194,75,.30)' : C.cardLine;
  return <div style={{display:'flex',gap:10,background:bg,border:`1px solid ${bd}`,borderRadius:8,padding:'12px 14px'}}>
    <span style={{flexShrink:0,marginTop:1,color:c,display:'flex'}}>
      <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
        <circle cx="8" cy="8" r="7" stroke="currentColor" strokeWidth="1.5"/>
        <path d="M8 4.4V8.6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
        <circle cx="8" cy="11.2" r="0.9" fill="currentColor"/>
      </svg>
    </span>
    <div style={{fontSize:12.5,color:'#D6DEEA',lineHeight:'18px'}}>{children}</div>
  </div>;
}

/* ===================================================================
   DASHBOARD
   =================================================================== */
function Dashboard({limits,go}){
  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24}}>
      {/* banner — surface-secondary plate */}
      <div style={{background:'#113255',borderRadius:8,padding:16,display:'flex',gap:12,alignItems:'flex-start'}}>
        <span style={{flexShrink:0,marginTop:0,color:C.gray,display:'flex'}}>
          <svg width="16" height="16" viewBox="0 0 16 16" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="8" cy="8" r="7" stroke="currentColor" strokeWidth="1.5"/>
            <path d="M8 4.4V8.6" stroke="currentColor" strokeWidth="1.5" strokeLinecap="round"/>
            <circle cx="8" cy="11.2" r="0.9" fill="currentColor"/>
          </svg>
        </span>
        <p style={{margin:0,fontFamily:FONT,fontWeight:400,fontSize:12,lineHeight:'16px',color:C.gray}}>
          Set deposit and session limits to stay in control. New limits apply immediately; edits and removals take effect after <span style={{color:'#fff',fontWeight:600}}>24 hours</span>.
        </p>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <Section>Deposit limit</Section>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <LimitCard icon="clock"    title="Daily deposit"   kind="deposit" limit={limits.daily}   onAction={()=>go('deposit',{period:'daily'})}/>
          <LimitCard icon="calendar" title="Weekly deposit"  kind="deposit" limit={limits.weekly}  onAction={()=>go('deposit',{period:'weekly'})}/>
          <LimitCard icon="calendar" title="Monthly deposit" kind="deposit" limit={limits.monthly} onAction={()=>go('deposit',{period:'monthly'})}/>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <Section>Session limit</Section>
        <div style={{display:'flex',flexDirection:'column',gap:12}}>
          <LimitCard icon="lock" title="Session limit" kind="session" limit={limits.session} onAction={()=>go('session',{})}/>
        </div>
      </div>
    </div>
  );
}

/* ===================================================================
   DEPOSIT EDITOR
   =================================================================== */
function tabStyle(active){return {flex:1,height:32,borderRadius:6,fontFamily:FONT,fontSize:14,lineHeight:'18px',fontWeight:700,
  background:active?C.accent:'transparent',color:active?'#fff':C.gray};}

function DepositEditor({limits,params,go,toSession,commitDeposit,removeFlow}){
  const startPeriod = params.period || 'daily';
  const [period,setPeriod] = useState(startPeriod);
  const existing = limits[startPeriod];
  const isEditing = existing.status!=='notset';
  const [amount,setAmount] = useState(existing.amount!=null?String(existing.amount):'');

  const num = parseInt(amount||'0',10) || 0;
  const periodChanged = period !== startPeriod;
  const usual = USUAL[period];
  const showRec = num>0 && num < usual*0.4;
  const related = PERIODS.filter(p=>p!==period).map(p=>({p,l:limits[p]}));

  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24,minHeight:'100%'}}>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <div style={{display:'flex',gap:2,background:'#091635',borderRadius:8,padding:4}}>
          {PERIODS.map(p=>(
            <button key={p} onClick={()=>setPeriod(p)} style={tabStyle(period===p)}>{PERIOD_LABEL[p]}</button>
          ))}
        </div>
      </div>

      {periodChanged && isEditing &&
        <InfoBanner>{PERIOD_LABEL[startPeriod]} limit will be removed. {PERIOD_LABEL[period]} limit will be created.</InfoBanner>}

      <Field label="Amount">
        <input value={amount} onChange={e=>setAmount(e.target.value.replace(/[^0-9]/g,''))}
          inputMode="numeric" placeholder="Enter amount"
          style={{flex:1,background:'transparent',border:'none',outline:'none',color:'#fff',fontFamily:FONT,fontSize:16,lineHeight:'20px'}}/>
        <span style={{color:C.gray,fontWeight:400,fontSize:16}}>lei</span>
      </Field>

      {showRec &&
        <div style={{background:'rgba(255,255,255,0.04)',border:`1px solid ${C.cardLine}`,borderRadius:8,padding:14,display:'flex',flexDirection:'column',gap:12}}>
          <div style={{fontSize:13,lineHeight:'19px',color:C.gray2}}>
            You usually spend around <b style={{color:'#fff'}}>{RON(usual)}</b> during this period. A very low limit may interrupt your play.
          </div>
          <button onClick={()=>setAmount(String(usual))} style={{
            alignSelf:'flex-start',background:'#007894',color:'#fff',fontFamily:FONT,fontWeight:700,fontSize:13,
            padding:'9px 16px',borderRadius:6}}>Use {RON(usual)}</button>
        </div>}

      {/* related limits — title outside, plate below; pinned to bottom */}
      <div style={{display:'flex',flexDirection:'column',gap:8,marginTop:'auto'}}>
        <Section>Related limits</Section>
        <div style={{background:'#113255',borderRadius:8,padding:'8px 16px',display:'flex',flexDirection:'column',gap:8}}>
          <div style={{display:'flex',flexDirection:'column'}}>
            {related.map(({p,l},i)=>(
              <div key={p} style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'10px 0',
                borderBottom:i<related.length-1?`1px solid rgba(255,255,255,0.08)`:'none',fontSize:14}}>
                <span style={{color:C.gray}}>{PERIOD_LABEL[p]}</span>
                <span style={{fontWeight:700,color:l.status==='notset'?C.gray:'#fff'}}>{l.status==='notset'?'Not Set':RON(l.amount)}</span>
              </div>
            ))}
          </div>
          <div style={{paddingBottom:10}}><Label>Daily ≤ Weekly ≤ Monthly. Conflicts are adjusted automatically.</Label></div>
        </div>
      </div>

      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Primary onClick={()=>commitDeposit({origPeriod:startPeriod,period,amount:num,isEditing,periodChanged})} disabled={num<=0}>Continue</Primary>
        {isEditing && existing.status!=='removal' &&
          <Secondary danger onClick={()=>removeFlow(startPeriod)}>Remove Limit</Secondary>}
      </div>
    </div>
  );
}

/* ===================================================================
   SESSION EDITOR
   =================================================================== */
function SessionEditor({limits,go,toDeposit,commitSession,removeFlow}){
  const existing = limits.session;
  const isEditing = existing.status!=='notset' && existing.status!=='removal';
  const [hours,setHours] = useState(existing.hours||null);
  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24,minHeight:'100%'}}>
      <InfoBanner>A session limit logs you out after the selected time. It is independent from deposit limits.</InfoBanner>
      <div style={{display:'flex',flexDirection:'column',gap:8}}>
        <Label>Hours per session</Label>
        <div style={{display:'grid',gridTemplateColumns:'1fr 1fr',gap:10}}>
          {SESSION_OPTS.map(h=>(
            <button key={h} onClick={()=>setHours(h)} style={{
              height:48,borderRadius:6,fontFamily:FONT,fontSize:15,fontWeight:700,color:'#fff',
              background:hours===h?'#007894':'transparent',
              border:hours===h?'none':`2px solid rgba(255,255,255,0.15)`,transition:'all .12s'}}>
              {h} {h===1?'Hour':'Hours'}
            </button>
          ))}
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10,marginTop:'auto'}}>
        <Primary onClick={()=>commitSession(hours,isEditing)} disabled={!hours}>Continue</Primary>
        {isEditing && <Secondary danger onClick={()=>removeFlow('session')}>Remove Limit</Secondary>}
      </div>
    </div>
  );
}

/* ===================================================================
   AUTO ADJUSTMENT
   =================================================================== */
function AutoAdjust({change,go}){
  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24}}>
      <div style={{textAlign:'center',marginTop:6}}>
        <div style={{width:48,height:48,borderRadius:24,background:'rgba(255,194,75,.14)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',fontSize:22}}>⚖️</div>
        <Section>Auto adjustment</Section>
        <div style={{fontSize:13,color:C.gray2,marginTop:6,lineHeight:'19px',padding:'0 4px'}}>
          To keep your limits valid (Daily ≤ Weekly ≤ Monthly), we’ll adjust the nearest conflicting limit.
        </div>
      </div>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        {change.related.map((r,i)=>(
          <div key={i} style={{background:C.card,border:`1px solid ${C.cardLine}`,borderRadius:8,padding:16}}>
            <div style={{fontSize:13,color:C.gray,marginBottom:6}}>{r.label}</div>
            <div style={{display:'flex',alignItems:'center',gap:10,fontSize:18,fontWeight:700}}>
              <span style={{color:C.gray,textDecoration:'line-through'}}>{r.from}</span>
              <span style={{color:C.amber}}>→</span>
              <span style={{color:'#fff'}}>{r.to}</span>
            </div>
          </div>
        ))}
      </div>
      <Primary onClick={()=>go('review')}>Continue</Primary>
    </div>
  );
}

/* ===================================================================
   REVIEW & CONFIRM
   =================================================================== */
function Review({change,go,confirm}){
  const [c1,setC1]=useState(false), [c2,setC2]=useState(false), [pw,setPw]=useState('');
  const ready = c1 && c2 && pw.length>=4;
  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24,minHeight:'100%'}}>
      <Section>Review &amp; confirm</Section>
      <div style={{background:C.card,border:`1px solid ${C.cardLine}`,borderRadius:8,padding:16,display:'flex',flexDirection:'column',gap:14}}>
        <div>
          <Label>Primary change</Label>
          <div style={{fontSize:15,fontWeight:700,marginTop:6}}>{change.primary.label}</div>
          <div style={{display:'flex',alignItems:'center',gap:8,marginTop:4,fontSize:16,fontWeight:700}}>
            {change.primary.from && <span style={{color:C.gray,textDecoration:'line-through'}}>{change.primary.from}</span>}
            {change.primary.from && <span style={{color:C.amber}}>→</span>}
            <span style={{color:'#fff'}}>{change.primary.to}</span>
          </div>
        </div>
        {change.related.length>0 &&
          <div style={{borderTop:`1px solid ${C.line}`,paddingTop:14}}>
            <Label>Related changes</Label>
            <div style={{marginTop:6}}>
              {change.related.map((r,i)=>(
                <div key={i} style={{display:'flex',justifyContent:'space-between',fontSize:13.5,padding:'4px 0'}}>
                  <span style={{color:C.gray}}>{r.label}</span>
                  <span><span style={{color:C.gray,textDecoration:'line-through'}}>{r.from}</span> <span style={{color:'#fff',fontWeight:700}}>{r.to}</span></span>
                </div>
              ))}
            </div>
          </div>}
      </div>

      <Check checked={c1} set={setC1}>I understand how deposit limits work.</Check>
      <Check checked={c2} set={setC2}>Removed or reduced limits remain active for 24 hours.</Check>

      <Field label="Confirm with password">
        <input type="password" value={pw} onChange={e=>setPw(e.target.value)} placeholder="Enter password"
          style={{flex:1,background:'transparent',border:'none',outline:'none',color:'#fff',fontFamily:FONT,fontSize:16,lineHeight:'20px'}}/>
      </Field>

      <div style={{marginTop:'auto'}}>
        <Primary onClick={confirm} disabled={!ready} variant="gradient">Confirm</Primary>
      </div>
    </div>
  );
}
function Check({checked,set,children}){
  return <button onClick={()=>set(!checked)} style={{display:'flex',gap:12,alignItems:'flex-start',textAlign:'left',width:'100%'}}>
    <span style={{width:24,height:24,borderRadius:4,flexShrink:0,marginTop:0,
      border:checked?'none':`1.5px solid ${C.line}`,
      background:checked?'rgba(255,255,255,0.08)':'transparent',
      color:'#19B8C7',fontWeight:900,fontSize:14,display:'flex',alignItems:'center',justifyContent:'center'}}>{checked?'✓':''}</span>
    <span style={{fontSize:13.5,lineHeight:'19px',color:C.gray2}}>{children}</span>
  </button>;
}

/* ===================================================================
   REMOVE CONFIRM
   =================================================================== */
function RemoveConfirm({target,limits,go,confirm}){
  const t = limits[target];
  const name = target==='session'?'Session Limit':PERIOD_LABEL[target]+' Deposit';
  const val = target==='session'? t.hours+'h per session' : RON(t.amount);
  return (
    <div className="view" style={{display:'flex',flexDirection:'column',gap:24}}>
      <div style={{textAlign:'center',marginTop:6}}>
        <div style={{width:48,height:48,borderRadius:24,background:'rgba(255,122,122,.14)',display:'flex',alignItems:'center',justifyContent:'center',margin:'0 auto 12px',fontSize:20}}>🗑️</div>
        <Section>Remove {name}?</Section>
      </div>
      <div style={{background:C.card,border:`1px solid ${C.cardLine}`,borderRadius:8,padding:16,display:'flex',justifyContent:'space-between'}}>
        <span style={{color:C.gray}}>Current limit</span>
        <span style={{fontWeight:700}}>{val}</span>
      </div>
      <InfoBanner tone="danger">This limit remains active for 24 hours after confirmation. It will expire on {futureDate(1)}.</InfoBanner>
      <div style={{display:'flex',flexDirection:'column',gap:10}}>
        <Primary onClick={confirm} variant="pink">Remove Limit</Primary>
        <Secondary onClick={()=>go('dashboard')}>Cancel</Secondary>
      </div>
    </div>
  );
}

/* ===================================================================
   ROOT APP  (functional logic unchanged)
   =================================================================== */
function App(){
  const [limits,setLimits] = useState(INITIAL);
  const [view,setView] = useState({name:'dashboard',params:{}});
  const [change,setChange] = useState(null);
  const [removeTarget,setRemoveTarget] = useState(null);
  const [toast,setToast] = useState(null);
  const [closed,setClosed] = useState(false);

  const go = (name,params={}) => setView({name,params});
  const flash = msg => { setToast(msg); setTimeout(()=>setToast(null),2400); };

  function commitDeposit({origPeriod,period,amount,isEditing,periodChanged}){
    const next = JSON.parse(JSON.stringify(limits));
    const related = [];
    const eff = p => next[p].status==='notset'?null:next[p].amount;
    if(periodChanged && isEditing) next[origPeriod]._remove = true;

    const valOf = p => p===period ? amount : (next[p]._remove?null:eff(p));
    const idx = PERIODS.indexOf(period);
    for(let i=idx-1;i>=0;i--){ const p=PERIODS[i],v=valOf(p);
      if(v!=null && v>amount){ related.push({label:PERIOD_LABEL[p]+' Deposit',from:RON(v),to:RON(amount)}); } }
    for(let i=idx+1;i<PERIODS.length;i++){ const p=PERIODS[i],v=valOf(p);
      if(v!=null && v<amount){ related.push({label:PERIOD_LABEL[p]+' Deposit',from:RON(v),to:RON(amount)}); } }

    const prevAmount = isEditing && !periodChanged ? eff(origPeriod) : null;
    const primary = {
      label: PERIOD_LABEL[period]+' Deposit' + (periodChanged?' (was '+PERIOD_LABEL[origPeriod]+')':''),
      from: prevAmount!=null?RON(prevAmount):null, to: RON(amount)
    };
    const descriptor = {
      kind:'deposit', origPeriod, period, amount, isEditing, periodChanged, primary, related,
      apply:()=>{
        setLimits(prev=>{
          const L = JSON.parse(JSON.stringify(prev));
          if(periodChanged && isEditing){
            L[origPeriod] = {amount:L[origPeriod].amount,status:'removal',date:futureDate(1)};
            L[period] = {amount, status:'active', date:null};
          } else {
            L[period] = {amount, status:isEditing?'pending':'active', date:isEditing?futureDate(1):null};
          }
          related.forEach(r=>{ const p=r.label.split(' ')[0].toLowerCase();
            L[p] = {amount, status:'pending', date:futureDate(1)}; });
          return L;
        });
      }
    };
    setChange(descriptor);
    go(related.length>0 ? 'autoadjust' : 'review');
  }

  function commitSession(hours,isEditing){
    const prev = limits.session.status!=='notset'? limits.session.hours : null;
    setChange({
      kind:'session',
      primary:{label:'Session Limit', from:prev!=null?prev+'h':null, to:hours+'h per session'},
      related:[],
      apply:()=>setLimits(p=>({...p,session:{hours,status:isEditing?'pending':'active',date:isEditing?futureDate(1):null}}))
    });
    go('review');
  }

  function removeFlow(target){ setRemoveTarget(target); go('remove'); }
  function confirmRemove(){
    const t=removeTarget;
    setLimits(p=>({...p,[t]:{...p[t],status:'removal',date:futureDate(1)}}));
    flash('Limit scheduled for removal — active for 24h');
    go('dashboard');
  }
  function confirmChange(){
    change.apply();
    flash(change.kind==='session' ? 'Session limit saved'
      : (change.isEditing?'Changes saved — active on '+futureDate(1):'Limit created and active now'));
    setChange(null); go('dashboard');
  }

  const titles = { dashboard:'Limits', deposit:'Deposit Limit', session:'Session Limit',
    autoadjust:'Auto Adjustment', review:'Review & Confirm', remove:'Remove Limit' };
  const canBack = view.name!=='dashboard';
  const back = () => {
    if(view.name==='review' && change && change.related.length>0) return go('autoadjust');
    if(view.name==='autoadjust') return go(change.kind==='session'?'session':'deposit',{period:change.period});
    if(view.name==='review') return go(change&&change.kind==='session'?'session':'deposit',{period:change&&change.period});
    go('dashboard');
  };

  function resetAll(){ setLimits(INITIAL); setChange(null); setRemoveTarget(null); }

  if(closed){
    return <BrowserChrome>
      <div style={{height:'100%',display:'flex',flexDirection:'column',position:'relative'}}>
        <div style={{flex:1,display:'flex',flexDirection:'column',alignItems:'center',justifyContent:'center',gap:16,padding:24,textAlign:'center'}}>
          <div style={{fontSize:40}}>👋</div>
          <div style={{fontSize:16,color:C.gray}}>Popup closed.</div>
          <button onClick={()=>{setClosed(false);go('dashboard');}} style={{color:'#fff',background:C.pink,padding:'10px 18px',borderRadius:6,fontWeight:700}}>Reopen Limits</button>
        </div>
        <div style={{padding:16}}>
          <Secondary onClick={()=>{resetAll();flash('All limits reset to Not Set');}}>Reset all limits</Secondary>
        </div>
        {toast && <div className="toast" style={{position:'absolute',left:16,right:16,bottom:76,background:'#0E3A66',border:`1px solid ${C.cardLine}`,borderRadius:8,padding:'12px 14px',fontSize:13,color:'#fff',boxShadow:'0 8px 24px rgba(0,0,0,.45)'}}>{toast}</div>}
      </div>
    </BrowserChrome>;
  }

  return (
    <BrowserChrome>
      {/* Pop up nav header — p16, gap16, min-h64 */}
      <div style={{display:'flex',flexDirection:'column',gap:16,padding:16,minHeight:64}}>
        <div style={{display:'flex',alignItems:'center',gap:16}}>
          <div style={{width:32,height:32,display:'flex',alignItems:'center'}}>
            {canBack && <button onClick={back} aria-label="Back" style={{width:32,height:32,borderRadius:6,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
              <svg width="8" height="13" viewBox="0 0 8 13" fill="none" xmlns="http://www.w3.org/2000/svg">
                <path d="M6.5 1.25L1.75 6.5L6.5 11.75" stroke="#fff" strokeWidth="2" strokeLinecap="round" strokeLinejoin="round"/>
              </svg>
            </button>}
          </div>
          <div style={{flex:1,textAlign:'center',fontFamily:FONT,fontWeight:700,fontSize:20,lineHeight:'26px',color:'#fff'}}>{titles[view.name]}</div>
          <button onClick={()=>setClosed(true)} style={{width:32,height:32,borderRadius:6,background:C.accent,display:'flex',alignItems:'center',justifyContent:'center'}}>
            <span style={{color:'#fff',fontSize:13,fontWeight:700}}>✕</span>
          </button>
        </div>
      </div>

      {/* Content — p16 */}
      <div className="scrollarea" style={{flex:1,overflowY:'auto',padding:'4px 16px 20px',position:'relative'}}>
        {view.name==='dashboard' && <Dashboard limits={limits} go={go}/>}
        {view.name==='deposit' && <DepositEditor limits={limits} params={view.params} go={go}
            toSession={()=>go('session',{})} commitDeposit={commitDeposit} removeFlow={removeFlow}/>}
        {view.name==='session' && <SessionEditor limits={limits} go={go}
            toDeposit={()=>go('deposit',{period:'daily'})} commitSession={commitSession} removeFlow={removeFlow}/>}
        {view.name==='autoadjust' && change && <AutoAdjust change={change} go={go}/>}
        {view.name==='review' && change && <Review change={change} go={go} confirm={confirmChange}/>}
        {view.name==='remove' && removeTarget && <RemoveConfirm target={removeTarget} limits={limits} go={go} confirm={confirmRemove}/>}
      </div>

      {toast && <div className="toast" style={{position:'absolute',left:16,right:16,bottom:18,background:'#0E3A66',border:`1px solid ${C.cardLine}`,borderRadius:8,padding:'12px 14px',fontSize:13,color:'#fff',boxShadow:'0 8px 24px rgba(0,0,0,.45)'}}>{toast}</div>}
    </BrowserChrome>
  );
}

/* ===================================================================
   BROWSER CHROME (faithful to Figma shell)
   =================================================================== */
function BrowserChrome({children}){
  return (
    <div className="device">
      <div style={{background:C.bars,paddingTop:14,paddingBottom:8,boxShadow:'0 1px 2px rgba(0,0,0,.2)'}}>
        <div style={{display:'flex',justifyContent:'space-between',alignItems:'center',padding:'2px 14px'}}>
          <span style={{color:'#fff',fontSize:13,opacity:.9,fontFamily:'Roboto'}}>10:00</span>
          <div style={{display:'flex',gap:5,alignItems:'center',opacity:.95}}>
            <span style={{fontSize:11}}>▲</span><span style={{fontSize:11}}>📶</span><span style={{fontSize:12}}>🔋</span>
          </div>
        </div>
        <div style={{display:'flex',alignItems:'center',gap:12,padding:'8px 12px 0'}}>
          <span style={{color:'#fff',fontSize:16}}>⌂</span>
          <div style={{flex:1,height:36,background:C.addr,borderRadius:18,display:'flex',alignItems:'center',padding:'0 14px'}}>
            <span style={{color:'#fff',fontSize:14,fontFamily:'Roboto'}}>mrbit.bg</span>
          </div>
          <span style={{color:'#fff',fontSize:13,border:'1.5px solid #fff',borderRadius:4,padding:'0 4px',fontWeight:700}}>1</span>
          <span style={{color:'#fff',fontSize:18}}>⋮</span>
        </div>
      </div>
      <div style={{background:C.night,height:660,display:'flex',flexDirection:'column',position:'relative'}}>
        {children}
      </div>
      <div style={{background:C.bars,height:15,display:'flex',alignItems:'center',justifyContent:'center'}}>
        <div style={{width:66,height:2,background:'#fff',borderRadius:1}}/>
      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App/>);
</script>
</body>
</html>
